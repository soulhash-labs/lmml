name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu minisign

      - name: Package x86_64 Linux
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          TARGET_TRIPLE=x86_64-unknown-linux-gnu \
          scripts/package-release.sh

      - name: Package AArch64 Linux
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          TARGET_TRIPLE=aarch64-unknown-linux-gnu \
          CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
          scripts/package-release.sh

      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Sign release checksums
        env:
          LMML_MINISIGN_SECRET_KEY: ${{ secrets.LMML_MINISIGN_SECRET_KEY }}
          LMML_MINISIGN_PUBLIC_KEY: ${{ secrets.LMML_MINISIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$LMML_MINISIGN_SECRET_KEY" ]; then
            echo "::error::LMML_MINISIGN_SECRET_KEY repository secret is required for public release signing."
            exit 1
          fi
          printf '%s\n' "$LMML_MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/lmml-minisign.key"
          chmod 600 "$RUNNER_TEMP/lmml-minisign.key"
          minisign -Sm dist/SHA256SUMS -s "$RUNNER_TEMP/lmml-minisign.key" -x dist/SHA256SUMS.minisig -W
          if [ -n "$LMML_MINISIGN_PUBLIC_KEY" ]; then
            minisign -Vm dist/SHA256SUMS -x dist/SHA256SUMS.minisig -P "$LMML_MINISIGN_PUBLIC_KEY"
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LMML ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/latest
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            release/LMML_MINISIGN_PUBLIC_KEY
            release/lmml-minisign.pub
            dist/install.sh
            dist/preflight.sh
            dist/uninstall.sh
            dist/lmml-*.tar.gz
