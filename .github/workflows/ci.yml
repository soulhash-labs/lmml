name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test lmml-api
        run: cargo test -p lmml-api -- --test-threads=1

      - name: Test lmml-build
        run: cargo test -p lmml-build -- --test-threads=1

      - name: Test lmml-compat
        run: cargo test -p lmml-compat -- --test-threads=1

      - name: Test lmml-detect
        run: cargo test -p lmml-detect -- --test-threads=1

      - name: Test lmml-models
        run: cargo test -p lmml-models -- --test-threads=1

      - name: Test lmml-node
        run: cargo test -p lmml-node -- --test-threads=1

      - name: Test lmml-router
        run: cargo test -p lmml-router -- --test-threads=1

      - name: Test lmml-server
        run: cargo test -p lmml-server -- --test-threads=1

      - name: Test lmml-tui settings state
        run: cargo test -p lmml-tui --lib app::settings_state::tests -- --test-threads=1

      - name: Test lmml-tui app
        run: cargo test -p lmml-tui --lib app::tests -- --test-threads=1

      - name: Test lmml-tui event loop
        run: cargo test -p lmml-tui --lib event_loop::tests -- --test-threads=1

      - name: Test lmml-tui runtime CLI unit
        run: cargo test -p lmml-tui --lib runtime_cli::tests -- --test-threads=1

      - name: Test lmml-tui detect tab
        run: cargo test -p lmml-tui --lib tabs::detect::tests -- --test-threads=1

      - name: Test lmml-tui snapshots
        run: cargo test -p lmml-tui --lib tabs::tests -- --test-threads=1

      - name: Test lmml-tui bin
        run: cargo test -p lmml-tui --bin lmml -- --test-threads=1

      - name: Test lmml-tui e2e
        run: cargo test -p lmml-tui --test e2e_smoke -- --test-threads=1

      - name: Test lmml-tui runtime CLI
        run: cargo test -p lmml-tui --test runtime_cli -- --test-threads=1

      - name: Test workspace docs
        run: cargo test --workspace --doc
