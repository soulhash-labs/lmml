[package]
name = "lmml-gateway"
version = "0.1.0"
edition = "2021"
description = "Policy-enforcing private-backend gateway for LMML runtimes"
license = "Apache-2.0"
repository = "https://github.com/soulhash-labs/lmml"

[dependencies]
axum = "0.8"
futures-util = "0.3"
lmml-api = { path = "../lmml-api" }
lmml-substrate = { path = "../lmml-substrate" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
