[package]
name = "lmml-substrate"
version = "0.1.0"
edition = "2021"
description = "Canonical model substrate and artifact lineage contracts for lmml"
license = "Apache-2.0"
repository = "https://github.com/soulhash-labs/lmml"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
